name: Build JAR, Build Docker Image, Push to ECR, and Update Helm

on:
  push:
    branches: [ "split-build-and-deploy" ]

env:
  AWS_REGION: af-south-1
  ECR_REPOSITORY: baseline-api
  INFRA_REPO: tapiwanasheMbizvo/baseline-api-k8s-app

permissions:
  id-token: write
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Spring Boot JAR
        run: ./mvnw clean package -DskipTests -Dspring.profiles.active=ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push docker image
        id: build-image
        run: |
          COMMIT_HASH=${GITHUB_SHA::7}
          echo "IMAGE_TAG=$COMMIT_HASH" >> $GITHUB_ENV
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}

          echo "Building Docker image..."
          docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$COMMIT_HASH \
                       -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest .

          echo "Pushing to ECR..."
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$COMMIT_HASH
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest

          echo "Image pushed: $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$COMMIT_HASH"

      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: baseline-api-k8s-app

      - name: Install yq
        run: sudo snap install yq

      - name: Update Helm values for all environments
        run: |
          cd baseline-api-k8s-app/environments

          for ENV in dev qa prod; do
            echo "Updating image tag for $ENV"
            yq e ".image.tag = \"${{ env.IMAGE_TAG }}\"" -i values-${ENV}.yaml
          done

      - name: Commit and push changes
        run: |
          cd baseline-api-k8s-app
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          if [[ -n "$(git status --porcelain)" ]]; then
            git add .
            git commit -m "Update image tag to ${{ env.IMAGE_TAG }} for all environments"
            git push
          else
            echo "No changes to commit."
          fi
